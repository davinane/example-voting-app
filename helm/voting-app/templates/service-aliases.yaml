  namespace: {{ .Release.Namespace }}
spec:
  type: ExternalName
  externalName: {{ include "voting.fullname" . }}-redis.{{ .Release.Namespace }}.svc.cluster.local
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: {{ .Release.Namespace }}
spec:
  type: ExternalName
  externalName: {{ include "voting.fullname" . }}-db.{{ .Release.Namespace }}.svc.cluster.local
